<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conic Gradient Card</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: #ffffff;
        }

        .card {
            width: 320px;
            height: 420px;
            border-radius: 12%;
            padding: 18px;
            background: conic-gradient(
                from 180deg,
                #ff6b6b,
                #feca57,
                #48dbfb,
                #1dd1a1,
                #5f27cd,
                #ff6b6b
            )padding-box,
                        conic-gradient(
                            from 180deg,
                            #ff6b6b,
                            #feca57,
                            #48dbfb,
                            #1dd1a1,
                            #5f27cd,
                            #ff6b6b
                        ) border-box;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
            position: relative;
            display: grid;
            place-items: center;
        }

        .inner {
            width: 100%;
            height: 100%;
            background: rgba(17, 24, 39, 0.88);
            border-radius: 12px;
            padding: 12px 10px;
            color: white;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border: 2px solid rgba(255,255,255,0.25);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="inner">
            <div class="badge"></div>
            <p style="font-size: 24px; margin: 0;">Box</p>
        </div>
    </div>
</body>
</html>
