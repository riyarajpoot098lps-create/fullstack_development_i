<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            .container {
                display: flex;
                flex-direction:row;
                font-size: 30px;
                flex-basis:100px;
                height: 200px;
                flex-wrap: wrap;
                text-align: center;
            }
            .container>div{
                outline: 1px dashed black;
                flex-basis:200px;
                text-align:center;
                justify-content: center;
                align-items: center;
            }
            .container>div:nth-child(odd){
                background-color:beige;
            }
            #box1,#box2,#box3,#box4,#box5,#box6{
                height:100px;
            }
            #box1{
                flex-grow:3;
            }
            #box2,#box3,#box4,#box5,#box6{
                flex-grow:1;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div id="box1">1</div>
            <div id="box2">2</div>
            <div id="box3">3</div>
            <div id="box4">4</div>
            <div id="box5">5</div>
        </div>
    </body>
</html>
