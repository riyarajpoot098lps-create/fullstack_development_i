<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Font Face</title>
    <style>
        @font-face {
            font-family: "HappySwirly";
            src: url("HappySwirly.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        h1 {
            font-family: "HappySwirly", sans-serif;
        }
        body { padding: 1rem; }
    </style>
</head>
<body>
    <h1>This is a heading with a custom font.</h1>
</body>
</html>
