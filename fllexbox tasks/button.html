<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>selector</title>
    <style>
       *{
        margin: 0;
        padding: 0;
        color:blue;
       }
      button:hover{
        background-color:black;
        color:white;
      }
      button:active{
        background-color:green;
        color:aqua;
      }
      button:focus{
        background-color:black;
        color:white;
      }
      a:link{
        text-decoration:none;
        color:black;
      }
      a:visited{
        color:green;
      }
      input:checked{
        box-shadow:1px 1p 5px black;
      }
      li:nth-child(3n){
        background-color:yellow;
      }

    </style>
</head>
<body>
    <p class="para" id="mypara" style="color:aqua">HELLO Riya</p>
    <button>click me!!</button>
    <a href="#1">Link</a>
    <input type="checkbox"checked/>
    <input type="checkbox"/>
    <ul>
        <li>1</li>
        <li>2</li>
        <li>3</li>
       <li>3</li>
       <li>4</li>


    </ul>

</body>
