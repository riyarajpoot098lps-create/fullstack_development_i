<!DOCTYPE html>
<head>
    <style>

        section h2{
            color:yellow;
            text-shadow:1px 1px 0 black;
        }
        section>h2{
            text-transform:lowercase;
        }
        h2+p{
            color:blue;
        }
        h2~p{
            text-transform:uppercase;
        }
    </style>
    <body>
        <section>
            <h2>HEading</h2>
            <p>Para1</p>
            <p>Para2</p>
            <div>
                <h2>Heading2❤️😀</h2>
            </div>
        </section>
    </body>
</head>
