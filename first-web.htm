<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container{
            width:500px;
            height: 300px;
            position: relative;
            overflow: hidden;
        }
        #img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #glass{
            position: absolute;
            top: 50%;
            left: 50%;
            width: 250px;
            padding: 30px;
            background-color: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            backdrop-filter: blur(10px);
            border:1px solid black;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=1170&q=80" alt="Background Image" style="width:100%; height: 300px; object-fit: cover;">
        <div class="glass"></div>
        <p>Heading</p>
    </div>
</body>
</html>
