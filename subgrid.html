
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root{
            --primary-color:blue;
            --secondary-color:black;
            --size:30px;
        }
        .container {
            height: 500px;
            width: 500px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: calc(var(--size/2));
            outline: 1px solid black;
            color: white;
            border-radius: 20%;
        }
        #parent {
            display: grid;
            grid-template-columns: subgrid;
            grid-template-rows: subgrid;
            grid-column: 1/3;
            grid-row: 1/3;
            background-color: var(--primary-color);
            border-radius: 30% 0 0 0;
        }
        #child {
            background-color: var(--secondary-color);
            grid-column: 2/3;
            grid-row: 2/3;
            font-size: var(--size);
            text-align: center;
            padding: 50px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div id="parent">
            <div id="child">Hello</div>
        </div>
    </div>
</body>
</html>
