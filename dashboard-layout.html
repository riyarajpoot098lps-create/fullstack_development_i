<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
        }

        /* Main Layout */
        .dashboard {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 220px;
            background: #222;
            color: white;
            padding: 20px;
        }

        .sidebar h2 {
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 5px;
        }

        .sidebar a:hover {
            background: #444;
        }

        /* Main Content */
        .main {
            flex: 1;
        }

        /* Navbar */
        .navbar {
            background: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            box-shadow: 0 2px 5px #ddd;
        }

        /* Content */
        .content {
            padding: 25px;
        }

        /* Cards */
        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ddd;
        }

        .card h3 {
            color: #666;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 28px;
            font-weight: bold;
        }

        /* Table */
        .table-box {
            background: white;
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        /* Responsive */
        @media (max-width: 800px) {
            .sidebar {
                width: 170px;
            }

            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .sidebar {
                display: none;
            }

            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <!-- Sidebar -->
        <aside class="sidebar">
            <h2>My Dashboard</h2>

            <a href="#">🏠 Home</a>
            <a href="#">📊 Analytics</a>
            <a href="#">👤 Users</a>
            <a href="#">⚙️ Settings</a>
            <a href="#">🚪 Logout</a>
        </aside>


        <!-- Main Area -->
        <main class="main">

            <!-- Navbar -->
            <nav class="navbar">
                <h3>Dashboard</h3>
                <span>Welcome, User 👋</span>
            </nav>


            <!-- Content -->
            <section class="content">

                <h1>Overview</h1>

                <!-- Cards -->
                <div class="cards">

                    <div class="card">
                        <h3>Total Users</h3>
                        <p>1,250</p>
                    </div>

                    <div class="card">
                        <h3>Revenue</h3>
                        <p>₹45,000</p>
                    </div>

                    <div class="card">
                        <h3>Orders</h3>
                        <p>320</p>
                    </div>

                    <div class="card">
                        <h3>Visitors</h3>
                        <p>8,540</p>
                    </div>

                </div>


                <!-- Table -->
                <div class="table-box">

                    <h2>Recent Users</h2>

                    <table>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Status</th>
                        </tr>

                        <tr>
                            <td>Rahul</td>
                            <td>rahul@gmail.com</td>
                            <td>Active</td>
                        </tr>

                        <tr>
                            <td>Aman</td>
                            <td>aman@gmail.com</td>
                            <td>Active</td>
                        </tr>

                        <tr>
                            <td>Riya</td>
                            <td>riya@gmail.com</td>
                            <td>Inactive</td>
                        </tr>
                    </table>

                </div>

            </section>

        </main>

    </div>

</body>
</html>
