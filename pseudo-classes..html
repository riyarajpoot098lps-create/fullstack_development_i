<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #box1,#box2,#box3{
            width:100px;
            height:100px;
            background-color:grey;
            margin:10px;

        }
        #box1:hover{
            background-color:green;
            box-shadow: 3px 3px 5px grey;
        }
        #box2:hover{
            background-color:red;
            box-shadow: 3px 3px 5px grey;
        }
        #box3:hover{
            background-color:blue;
            box-shadow: 3px 3px 5px grey;
        }
        #box1:focus{
            background-color:pink;
            box-shadow: 3px 3px 5px grey;
        }
        #box2:focus{
            background-color:cyan;
            box-shadow: 3px 3px 5px grey;
        }
        #box3:focus{
            background-color:orange;
            box-shadow: 3px 3px 5px grey;
        }
        #box1:active{
            background-color:yellow;
            box-shadow: 0 0 0 transparent;
        }
        #box2:active{
            background-color:orange;
            box-shadow: 0 0 0 transparent;
        }
        #box3:active{
            background-color:purple;
             box-shadow: 0 0 0 transparent;
        }
        a:link{
            color:white;
            background-color:black;
            padding: 5px;
            text-decoration:none;
            border-radius: 5px;
            
        }
        a:visited{
            color:yellow;
        }
    </style>
</head>
<body>
    <!-- <div id="box1"></div>
    <div id="box2"></div>
    <div id="box3"></div> -->

    <button id="box1" >Box 1</button>
    <button id="box2" >Box 2</button>
    <button id="box3" >Box 3</button>
    <a href="#7">Link</a>

</body>
</html>
