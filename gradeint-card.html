<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Health Dashboard</title>

    <style>

        body{
            display:flex;
            gap:30px;
            padding:30px;
            background:#f5f5f5;
        }
        .card{
            width:300px;
            height:300px;
            background:#ace8dd;
            display:flex;
            justify-content:center;
            align-items:center;
            border-radius:15px;
        }
       .circle{
            --progress:30%;

            width:150px;
            height:150px;

            border-radius:50%;

            background:conic-gradient(
                rgb(255, 0, 191) var(--progress),
                rgb(12, 12, 12) var(--progress)
            );

            display:flex;
            justify-content:center;
            align-items:center;
        }

        .circle div{
            width:100px;
            height:100px;
            border-radius:50%;
            background:white;

            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
        }

        .circle h2{
            margin:0;
        }

        .circle p{
            margin:5px 0 0;
        }


        .health-card{
            width:300px;
            height:300px;
            background:white;

            padding:30px;
            box-sizing:border-box;

            border-radius:15px;

            display:flex;
            flex-direction:column;
            justify-content:center;
        }

        .health-card h2{
            margin:0 0 10px;
        }

        .health-card p{
            margin:5px 0 20px;
            color:#555;
        }

        .health-bar{
            width:100%;
            height:25px;

            background:#ddd;

            border-radius:20px;

            overflow:hidden;
        }

        .health-progress{
            width:70%;
            height:100%;

            background:linear-gradient(
                to right,
                red,
                orange,
                rgb(213, 213, 213)
            );

            border-radius:20px;
        }

    </style>
</head>

<body>


    <div class="card">

        <div class="circle">

            <div>
                <h2>75%</h2>
                <p>Power</p>
            </div>

        </div>

    </div>


    <div class="health-card">

        <h2>Health</h2>

        <p>Overall Health: 70%</p>

        <div class="health-bar">
            <div class="health-progress"></div>
        </div>

    </div>

</body>
</html>
