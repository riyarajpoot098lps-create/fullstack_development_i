
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        form {
            width: 350px;
            padding: 30px;
            border: 1px solid #ccc;
            border-radius: 12px;
            background-color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .submit-btn {
            
            width: 60%;
            height: 40px;
            margin-top: 20px;
            background-color: #4CAF50;
            color: white;
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .input {
            display: block;
            width: 90%;
            height: 38px;
            margin: auto;
            padding: 8px 10px;
            border-radius: 5px;
            border: 1px solid #999;
        }
    </style>
</head>

<body>

    <form>
        <h2>Login</h2>

        <div class="form-group">
            <label for="username">Username:</label>
            <input 
                type="text" 
                id="username" 
                name="username" 
                class="input"
            >
        </div>

        <div class="form-group">
            <label for="password">Password:</label>
            <input 
                type="password" 
                id="password" 
                name="password" 
                class="input"
            >
        </div>

        <input 
            type="submit" value="Login" class="submit-btn">
    </form>

</body>
</html>
