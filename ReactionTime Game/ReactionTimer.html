<!DOCTYPE html>
<html>
<head>
    <title>Reaction Timer</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        #box {
            width: 500px;
            height: 300px;
            background-color: lightgray;
            margin: 30px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
            cursor: pointer;
        }

        #startBtn {
            padding: 10px 20px;
            font-size: 18px;
        }

        #result {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Reaction Timer</h1>

    <div id="box">
        Click Start
    </div>

    <button id="startBtn">Start</button>

    <h2 id="result"></h2>

    <script src="ReactionTimer.js"></script>

</body>
</html>
