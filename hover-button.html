<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button{
            background-color: blue;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            border:none;
            cursor:pointer;
        }
        button:hover{
            background-color: green;
            color: white;
            box-shadow:3px 3px 5px grey;
        }
        button:active{
            background-color: red;
            color: black;
        }
        a:link{
            color:white;
            background-color:black;
            padding: 5px;
            text-decoration:none;
            border-radius: 5px;
            
        }
        a:visited{
            color:yellow;
        }
        input:checked{
            accent-color:red;
        }
        input:not(:checked){
            box-shadow: 0 0 5px black;
        }
    </style>
</head>
<body>
    <input type="checkbox" />
    <input type="checkbox"/>
    <button>Click Me </button>
    <a href="https://rb-rishabh.pages.dev">Link</a>
</body>
</html>
