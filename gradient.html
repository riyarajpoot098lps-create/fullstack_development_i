<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .card{
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 50px auto;
        }

        .circle{
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: conic-gradient(blue 75%, rgb(211, 211, 211) 75%);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .circle div{
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: white;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

    </style>
</head>

<body style="background-color: black;">

    <div class="card">

        <div class="circle">
            <div>
                <h2>75%</h2>
                <p>Power</p>
            </div>
        </div>

    </div>

</body>
</html>
