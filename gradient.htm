<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradients</title>

    <style>

        body{
            display:grid;
            grid-template-columns:300px 300px 300px;
            gap:20px;
        }

        p{
            margin:0;
            font-weight:bold;
        }

        .box1, .box2, .box3{
            width:300px;
            height:300px;
        }

        .box1{
            background:linear-gradient(#ff0000, #10c96d, yellow, green, blue);
        }

        .box2{
            background:radial-gradient(circle, #ff0000, #000000);
        }

        .box3{
            background:conic-gradient(#ff0000, #080703);
        }

    </style>
</head>

<body>

    <p>Linear Gradient</p>
    <p>Radial Gradient</p>
    <p>Conic Gradient</p>

    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>

</body>
</html>
