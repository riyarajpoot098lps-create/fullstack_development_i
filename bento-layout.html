<html>
<head>
    <style>
        *{
            margin:0;
            padding:20px;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f2f2f2;
        }

        .container{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:20px;
        }

        .card{
            background:white;
            border-radius:15px;
            overflow:hidden;
            text-align:center;
            box-shadow:0 4px 10px rgba(0,0,0,0.2);
        }

        .card img{
            width:100%;
            height:180px;
            object-fit:cover;
        }

        .card h2{
            margin:10px 0;
        }

        .card p{
            margin-bottom:15px;
        }

        .large{
            grid-column:span 2;
            grid-row:span 4;
        }

        .wide{
            grid-column:span 2;
        }

        .tall{
            grid-row:span 1;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card large">
        <img src="https://images.unsplash.com/photo-1546868871-7041f2a55e12?w=900&auto=format&fit=crop&q=60">
        <h2></h2>
        <p>Graphic Designer</p>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1545127398-14699f92334b?w=900&auto=format&fit=crop&q=60">
        <h2></h2>
        <p>Web Developer</p>
    </div>

    <div class="card tall">
        <img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=900&auto=format&fit=crop&q=60">
        <h2></h2>
        <p>Laptop Incharge</p>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1623126908029-58cb08a2b272?w=900&auto=format&fit=crop&q=60">
        <h2></h2>
        <p>Tablet Incharge</p>
    </div>

    <div class="card wide">
        <img src="https://images.unsplash.com/photo-1512941937669-90a1b58e7e9c?w=900&auto=format&fit=crop&q=60">
        <h2></h2>
        <p>Project Manager</p>
    </div>

</div>

</body>
</html>
